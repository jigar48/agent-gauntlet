name: "agent-gauntlet"
description: "Audit a checkout journey the way an AI shopping agent runs it. Stops before payment; never places an order."
author: "Jigar Prajapati"
branding:
  icon: shopping-cart
  color: blue

inputs:
  journey:
    description: "Path to the journey YAML file, relative to the workspace."
    required: true
  permission-confirmed:
    description: >-
      Set to "true" only if you own the site or have written permission to test it.
      Required for any host other than localhost.
    required: false
    default: "false"
  output-dir:
    description: "Directory for result.json, report.html and screenshots."
    required: false
    default: "gauntlet-out"
  python-version:
    description: "Python version used to run agent-gauntlet (3.12 or newer)."
    required: false
    default: "3.12"
  artifact-name:
    description: "Name of the uploaded report artifact."
    required: false
    default: "agent-gauntlet-report"
  fail-on-findings:
    description: 'Fail the job when agent-gauntlet exits non-zero (a FAIL result or a journey error). Use "false" to only report.'
    required: false
    default: "true"

outputs:
  exit-code:
    description: "agent-gauntlet exit code: 0 no FAIL, 1 at least one FAIL, 2 usage, config or journey error."
    value: ${{ steps.audit.outputs.exit-code }}
  report-path:
    description: "Path to the generated report.html."
    value: ${{ steps.audit.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install agent-gauntlet and Chromium
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$ACTION_PATH"
        python -m playwright install --with-deps chromium

    - name: Run the audit
      id: audit
      shell: bash
      env:
        JOURNEY: ${{ inputs.journey }}
        OUT_DIR: ${{ inputs.output-dir }}
        PERMISSION: ${{ inputs.permission-confirmed }}
      run: |
        args=(run "$JOURNEY" --out "$OUT_DIR")
        if [ "$PERMISSION" = "true" ]; then
          args+=(--i-have-permission)
        fi
        set +e
        agent-gauntlet "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report-path=$OUT_DIR/report.html" >> "$GITHUB_OUTPUT"

    - name: Add scorecard to the job summary
      if: always()
      shell: bash
      env:
        OUT_DIR: ${{ inputs.output-dir }}
      run: |
        if [ -f "$OUT_DIR/result.json" ]; then
          {
            echo '### agent-gauntlet scorecard'
            echo '```text'
            agent-gauntlet report "$OUT_DIR/result.json" --out "$OUT_DIR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload report and screenshots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}
        if-no-files-found: ignore

    - name: Fail on findings
      if: inputs.fail-on-findings == 'true' && steps.audit.outputs.exit-code != '0'
      shell: bash
      env:
        CODE: ${{ steps.audit.outputs.exit-code }}
      run: |
        echo "agent-gauntlet exited with code $CODE (1 = at least one FAIL, 2 = usage, config or journey error)."
        exit "$CODE"
