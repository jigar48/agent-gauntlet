name: Demo site

# Builds the five sample reports from the built-in FAKE fixture shops (all on localhost inside
# the runner) and publishes them to GitHub Pages. No real site is contacted.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e .
          playwright install --with-deps chromium
      - name: Run the demo (fails if a fake shop does not behave as designed)
        run: agent-gauntlet demo --out site
      - name: Keep the demo out of search engines
        run: |
          touch site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
